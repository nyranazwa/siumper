<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiUMPER – Prototype Bot Telegram</title>
<link rel="stylesheet" href="css/style.css?v=6">
<script>(function(){var t=null;try{t=localStorage.getItem("siumper-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)})()</script></head><body>
<div id="app">
<header><div class="av">🤖</div><div><b>SiUmper</b><small>bot • prototype</small></div><button id="theme" type="button" aria-label="Ganti mode terang/gelap"></button></header>
<div id="log"></div>
<div class="hint" id="hint"></div>
<div class="chips" id="chips"></div>
<form id="f"><label class="clip" title="Unggah foto / dokumen">📎<input id="file" type="file" accept="image/*,.pdf" hidden></label>
<input id="in" type="text" placeholder="Message" autocomplete="off"><button type="submit">➤</button></form>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/cloud.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script src="js/helpers.js?v=6"></script>
<script src="js/flows.js?v=6"></script>
<script src="js/logger.js?v=6"></script>
<script src="js/main.js?v=6"></script></body></html>
